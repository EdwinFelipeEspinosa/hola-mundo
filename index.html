<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Hola, mundo</title>
	<style>
		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			font-family: Inter, "Segoe UI", system-ui, sans-serif;
			color: #f8fafc;
			background: radial-gradient(circle at top, #334b82, #171b33 58%, #101323);
		}

		main {
			width: min(100%, 680px);
			padding: clamp(48px, 10vw, 88px) 24px;
			text-align: center;
			border: 1px solid rgb(255 255 255 / 14%);
			border-radius: 28px;
			background: rgb(255 255 255 / 7%);
			box-shadow: 0 24px 72px rgb(0 0 0 / 30%);
		}

		p {
			margin: 0 0 16px;
			color: #a5b4fc;
			font-size: 0.85rem;
			font-weight: 700;
			letter-spacing: 0.18em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-size: clamp(2.8rem, 9vw, 5.5rem);
			font-weight: 800;
			letter-spacing: -0.06em;
			line-height: 1.08;
			color: #fff;
			background: linear-gradient(110deg, #fff 20%, #c4b5fd 60%, #67e8f9);
			-webkit-background-clip: text;
			background-clip: text;
			-webkit-text-fill-color: transparent;
		}
	</style>
</head>
<body>
	<main>
		<p>Un pequeño comienzo</p>
		<h1>¡Hola, mundo!</h1>
		<h1>este es un cambio para feature-1</h1>
	</main>
</body>
</html>
